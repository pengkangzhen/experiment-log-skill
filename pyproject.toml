[tool.poetry]
name = "claude-code-skill-dev"
version = "0.2.0"
description = "A reusable Claude Code skill development framework"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    {include = "claude_code_skill_dev", from = "src"},
    {include = "experiment_log", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.0"
rich = "^13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
ruff = "^0.1.0"
mypy = "^1.0"

[tool.poetry.scripts]
exp-log = "experiment_log.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
